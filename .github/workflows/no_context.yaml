name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies and run tests
        run: |
          apt install -y adduser base-files bash bash-completion binutils ca-certificates command-not-found cpp-11 cron debconf distro-info-data e2fsprogs fuse3 gcc gcc-11 gettext-base hdparm keyutils libattr1:amd64 libaudit-common libbinutils:amd64 libc-bin libc6-dev:amd64 libc6:amd64 libctf0:amd64 libgcc-11-dev:amd64 libgmp10:amd64 libisl23:amd64 libmagic1:amd64 libmecab2:amd64 libmpc3:amd64 libmpfr6:amd64 libpam-runtime libpcre2-8-0:amd64 libpython3.11-dev:amd64 libpython3.11-minimal:amd64 libpython3.11-stdlib:amd64 libsensors-config libtirpc-common libzstd1:amd64 linux-libc-dev:amd64 locales login logrotate lsb-release ltrace mailcap man-db media-types multipath-tools nano ncurses-base netbase nftables openssl overlayroot procps python3-distutils python3-zope.interface python3.11-minimal rsyslog screen sudo tar tzdata ucf unixodbc-common usb-modeswitch walinuxagent wget
          pip install tomli_w==1.2.0
          python -m pip install --upgrade hatch
          hatch run +py=3.11 test:with-coverage
          hatch run +py=3.11 integration:test